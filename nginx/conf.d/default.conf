limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

log_format nginx_json escape=json '{"ts":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"request_time":$request_time,"bytes":$body_bytes_sent,"remote_addr":"$remote_addr","request_id":"$request_id","user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name localhost billing.local;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    access_log /dev/stdout nginx_json;
    error_log /dev/stderr warn;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Request-Id $request_id always;

    location = /health {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}